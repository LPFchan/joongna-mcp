[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "joongna-mcp"
version = "0.1.0"
description = "MCP server for Joongna search-price lookups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.28.1,<1.0",
  "mcp>=2.0.0,<3.0",
  "pydantic>=2.11.0,<3.0",
  "starlette>=0.47.0,<1.0",
  "uvicorn>=0.35.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
]

[project.scripts]
joongna-mcp = "joongna_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/joongna_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
